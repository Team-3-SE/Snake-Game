
name: Snake Game CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows Build, Tests and Coverage
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Configure Git line endings
        run: git config --global core.autocrlf input

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install MSYS2 and GCC
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install gcovr
        run: python -m pip install gcovr

      - name: Build and run automated tests
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:Path = "$env:MSYS2_LOCATION\ucrt64\bin;$env:Path"
          g++ --version
          & .\tests\run_sprint2_tests.ps1
          if ($LASTEXITCODE -ne 0) {
              throw "Sprint 2 tests failed."
          }

      - name: Generate line and branch coverage report
        if: success()
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:Path = "$env:MSYS2_LOCATION\ucrt64\bin;$env:Path"

          New-Item -ItemType Directory -Force `
            -Path "build/sprint2-tests/coverage-report" | Out-Null

          python -m gcovr `
            --root "." `
            --object-directory "build/sprint2-tests/coverage-data" `
            --gcov-executable "$env:MSYS2_LOCATION\ucrt64\bin\gcov.exe" `
            --filter "src/" `
            --branches `
            --txt-summary `
            --html-details "build/sprint2-tests/coverage-report/index.html"

          if ($LASTEXITCODE -ne 0) {
              throw "Coverage report generation failed."
          }

      - name: Upload Windows executable
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: snake-game-console-windows
          path: build/sprint2-tests/snake_game_console.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-and-branch-coverage-report
          path: build/sprint2-tests/coverage-report/
          if-no-files-found: warn
          retention-days: 7

  cpp-lint:
    name: C++ Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cppcheck

      - name: Run C++ static analysis
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=assertWithSideEffect:tests/* \
            --platform=win64 \
            --std=c++17 \
            -I src \
            src tests


name: Snake Game CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows Build, Tests and Coverage
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install MSYS2 and GCC
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gcovr
        shell: pwsh
        run: |
          python -m pip install gcovr

      - name: Build and run automated tests
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:Path = "$env:MSYS2_LOCATION\ucrt64\bin;$env:Path"

          Write-Host "Checking GCC..."
          g++ --version

          if ($LASTEXITCODE -ne 0) {
              throw "GCC is not working."
          }

          Write-Host "Running automated tests..."

          & .\tests\run_sprint2_tests.ps1

          if ($LASTEXITCODE -ne 0) {
              throw "Automated tests failed."
          }

      - name: Generate line and branch coverage report
        if: success()
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:Path = "$env:MSYS2_LOCATION\ucrt64\bin;$env:Path"

          Write-Host "========== COVERAGE DIAGNOSTICS =========="

          Write-Host "Current directory:"
          Get-Location

          $projectPath = $env:GITHUB_WORKSPACE
          $coverageDataPath = Join-Path $projectPath "build\all-tests\coverage-data"
          $coverageReportPath = Join-Path $projectPath "build\all-tests\coverage-report"

          Write-Host "Project path: $projectPath"
          Write-Host "Coverage data path: $coverageDataPath"

          if (-not (Test-Path -LiteralPath $coverageDataPath -PathType Container)) {
              Write-Host "Build directory contents:"
              Get-ChildItem (Join-Path $projectPath "build") -Recurse -ErrorAction SilentlyContinue
              throw "Coverage data directory does not exist."
          }

          Write-Host "Coverage data directory exists."

          $gcdaFiles = @(Get-ChildItem -LiteralPath $coverageDataPath -Recurse -Filter "*.gcda")
          $gcnoFiles = @(Get-ChildItem -LiteralPath $coverageDataPath -Recurse -Filter "*.gcno")

          Write-Host "GCDA files found: $($gcdaFiles.Count)"
          Write-Host "GCNO files found: $($gcnoFiles.Count)"

          if ($gcdaFiles.Count -eq 0) {
              throw "No GCDA coverage files were generated."
          }

          if ($gcnoFiles.Count -eq 0) {
              throw "No GCNO coverage files were generated."
          }

          New-Item -ItemType Directory -Force -Path $coverageReportPath | Out-Null

          $gcovPath = Join-Path $env:MSYS2_LOCATION "ucrt64\bin\gcov.exe"

          Write-Host "Checking GCOV..."
          & $gcovPath --version

          if ($LASTEXITCODE -ne 0) {
              throw "GCOV is not working."
          }

          Write-Host "Checking gcovr..."
          python -m gcovr --version

          if ($LASTEXITCODE -ne 0) {
              throw "gcovr is not installed correctly."
          }

          Write-Host "Generating coverage report..."

          python -m gcovr `
            --root "$projectPath" `
            --gcov-executable "gcov" `
            --filter "$projectPath/src/" `
            --txt-summary `
            --html-details "$coverageReportPath/index.html"

          if ($LASTEXITCODE -ne 0) {
              throw "Coverage report generation failed."
          }

          Write-Host "Coverage report generated successfully."

      - name: Upload Windows executable
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: snake-game-console-windows
          path: build/all-tests/snake_game_console.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-and-branch-coverage-report
          path: build/all-tests/coverage-report/
          if-no-files-found: warn
          retention-days: 7

  cpp-lint:
    name: C++ Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cppcheck

      - name: Run C++ static analysis
        run: |
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            --suppress=assertWithSideEffect:tests/* \
            --platform=win64 \
            --std=c++17 \
            -I src \
            src tests
